name: Build APK from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          echo "=== Files in repo ==="
          ls -la
          unzip -o *.zip -d project
          if [ -d project/ClipsKittyAndroid ]; then
            shopt -s dotglob
            mv project/ClipsKittyAndroid/* project/ 2>/dev/null || true
            shopt -u dotglob
          fi
          echo "=== Project contents ==="
          ls -la project/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x project/gradlew

      - name: Build Debug APK
        working-directory: project
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipsKitty-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
