name: Build APK from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Unzip project
        run: |
          unzip -o *.zip -d project
          if [ -d project/ClipsKittyAndroid ]; then
            mv project/ClipsKittyAndroid/* project/ 2>/dev/null || true
            mv project/ClipsKittyAndroid/.* project/ 2>/dev/null || true
          fi
          ls -la project/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: |
          cd project
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: project
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipsKitty-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
